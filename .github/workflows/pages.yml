name: Pubblica Amministrativa 3.0 su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scansione segreti
        run: node scripts/secret-scan.mjs
      - name: Test
        run: node --test tests/agent.test.mjs tests/frontend-bridge.test.mjs tests/contracts.test.mjs

  deploy:
    needs: verifica
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara i soli file pubblici
        run: |
          mkdir -p _site
          cp -R index.html config.js assets modules .nojekyll _site/
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
