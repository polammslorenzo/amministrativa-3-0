name: Pubblica Amministrativa 3.0 su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara i soli file pubblici
        run: |
          mkdir -p _site
          cp -R index.html config.js assets modules .nojekyll _site/
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
